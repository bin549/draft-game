version: "2.2"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stickman-learning
    restart: unless-stopped
    ports:
      - "8765:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
